<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f34b35">

  <title>Doorway To Heaven</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/scripts.js" defer></script>
</head>

<body>

  <main class="canvas" aria-label="An interactive canvas">

    <div class="field">

      <div class="doors">
        <button class="door" type="button" aria-label="Door 1"></button>
        <button class="door" type="button" aria-label="Door 2"></button>
        <button class="door" type="button" aria-label="Door 3"></button>
        <button class="door" type="button" aria-label="Door 4"></button>
        <button class="door" type="button" aria-label="Door 5"></button>
        <button class="door" type="button" aria-label="Door 6"></button>
        <button class="door" type="button" aria-label="Door 7"></button>
        <button class="door" type="button" aria-label="Door 8"></button>
        <button class="door" type="button" aria-label="Door 9"></button>
        <button class="door" type="button" aria-label="Door 10"></button>
        <button class="door" type="button" aria-label="Door 11"></button>
        <button class="door" type="button" aria-label="Door 12"></button>
      </div>

      <div class="eyes">
        <i class="eye"><span class="pupil"></span></i>
        <i class="eye"><span class="pupil"></span></i>
        <i class="eye"><span class="pupil"></span></i>
        <i class="eye"><span class="pupil"></span></i>
        <i class="eye"><span class="pupil"></span></i>
        <i class="eye"><span class="pupil"></span></i>
        <i class="eye"><span class="pupil"></span></i>
        <i class="eye"><span class="pupil"></span></i>
        <i class="eye"><span class="pupil"></span></i>
      </div>

    </div>

    <div class="grain" aria-hidden="true"></div>

    <header class="topline">
      <span class="wordmark">
        DOORWAY<br>TO HEAVEN
      </span>
    </header>

  </main>

</body>
</html>
